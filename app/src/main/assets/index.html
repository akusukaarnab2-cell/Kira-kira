<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:sans-serif;background:#f4f1ff;color:#1e1b4b;height:100vh;display:flex;flex-direction:column}
header{padding:30px 18px 6px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:30px;color:#7c5cff}
small{color:#6b6b8a}
.mw{position:relative;height:84px;width:91px;pointer-events:none;-webkit-user-select:none;user-select:none;filter:drop-shadow(0 5px 6px rgba(92,60,200,.22));animation:bob 3.4s ease-in-out infinite}
.mw img{position:absolute;left:0;top:0;width:100%;height:100%}
.mw .arm{transform-origin:77.5% 47.1%;animation:wave 3s ease-in-out infinite}
.mw.big{height:110px;width:119px;margin:0 auto}
#mascot{margin:-4px 2px 6px 0}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes wave{0%,67%,100%{transform:rotate(0)}7%{transform:rotate(-14deg)}17%{transform:rotate(14deg)}27%{transform:rotate(-14deg)}37%{transform:rotate(14deg)}47%{transform:rotate(-14deg)}57%{transform:rotate(14deg)}}
@media(prefers-reduced-motion:reduce){.mw,.mw .arm{animation:none}}
main{flex:1;overflow:auto;padding:8px 14px}
.page{display:none}.page.on{display:block}
#disp{background:#e9e8ff;border-radius:22px;padding:14px 18px;text-align:right;min-height:104px}
#ex{color:#777;font-size:18px;min-height:24px;overflow-wrap:anywhere}
#res{font-size:44px;font-weight:700;word-break:break-all}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pad button{height:62px;border:0;border-radius:18px;font-size:24px;font-weight:700;background:#fffbea;color:#1e1b4b;box-shadow:0 2px 4px #0001}
.pad .f{background:#e6e3ff;color:#7c5cff}.pad .o{background:#ffe1c2;color:#d9480f}
.pad .c{background:#ffd9e0;color:#c92a2a}.pad .eq{background:#b8f0d8;color:#087f5b}
.pad .z{grid-column:span 2}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:0;border-radius:18px;padding:14px 6px;font-size:17px;font-weight:700;color:#1e1b4b}
.cat .ci{display:block;margin:0 auto 3px}
.cat .ci svg{width:46px;height:46px;display:block;margin:0 auto}
#ct{display:flex;align-items:center;gap:8px;font-size:18px}
#ct svg{width:30px;height:30px;flex:none}
.tstar svg{width:30px;height:30px;vertical-align:-6px}
.spk svg{width:20px;height:20px;vertical-align:-3px}
.li svg{width:26px;height:26px;vertical-align:-7px;margin-right:4px}.cat small{display:block;font-weight:400}
.box{background:#fff;border-radius:18px;padding:14px;margin-top:12px}
.row{display:flex;gap:8px;margin-top:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:18px;background:#f8f8ff}
select{flex:1.5;min-width:0;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:18px;background:#f8f8ff}
nav{display:flex;background:#fff;padding:8px;gap:8px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border:0;border-radius:18px;padding:10px;background:none;font-size:15px;color:#777}
nav button.on{background:#e6e3ff;color:#7c5cff;font-weight:700}
.ab{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:16px}
nav button:not(.on) svg{filter:grayscale(.75) opacity(.75)}
.cat.sel{background:#e6e3ff!important;outline:3px solid #7c5cff}
.swaprow{display:flex;justify-content:center;margin:6px 0 -2px}
#swap{width:34px;height:34px;border-radius:50%;border:2px solid #7c5cff;background:#e6e3ff;box-shadow:0 3px 8px rgba(124,92,255,.25);padding:0;display:flex;align-items:center;justify-content:center;transition:transform .35s ease,background .15s}
#swap:active{background:#d9ccff}
#swap svg{width:22px;height:22px}
#modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:20px}
#modal .box{max-height:80vh;overflow:auto;width:100%;margin:0}

<script>
const $=s=>document.querySelector(s);
const [VN,VC]=(window.App?App.version():'dev|0').split('|');
$('#vn').textContent=VN;$('#vc').textContent=VC;
let LANG='ms';try{LANG=localStorage.getItem('lang')||'ms'}catch(_){}
const T={
ms:{title:'Kalkulator',tagline:'Kira apa sahaja, lebih mudah!',swap:'Tukar unit',navCalc:'Kira',navConv:'Penukar',navSet:'Tetapan',pick:'Pilih jenis pertukaran:',err:'Ralat',about:'Tentang',version:'Versi',build:'Build',by:'Dibuat oleh',changes:'Info perubahan terkini',changesTitle:'Info Perubahan Terkini',close:'Tutup',lang:'Bahasa'},
en:{title:'Calculator',tagline:'Calculate anything, made easier!',swap:'Swap units',navCalc:'Calc',navConv:'Converter',navSet:'Settings',pick:'Choose a conversion type:',err:'Error',about:'About',version:'Version',build:'Build',by:'Made by',changes:'Latest changes',changesTitle:'Latest Changes',close:'Close',lang:'Language'}};
const t=k=>T[LANG][k];

/* ---- Kalkulator ---- */
let ex='',done=false;
const K=[['C','C','c'],['+/-','n','f'],['%','%','f'],['÷','/','o'],['7'],['8'],['9'],['×','*','o'],
['4'],['5'],['6'],['−','-','o'],['1'],['2'],['3'],['+','+','o'],['0','0','z'],['.','.',''],['=','=','eq']];
$('#pad').innerHTML=K.map(([l,k,c])=>`<button class="${c||''}" data-k="${k||l}">${l}</button>`).join('');
$('#pad').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)};
const minus=s=>s;
function pretty(s){
  let o='';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if('+-*/'.includes(c)){
      const g=c==='*'?'×':c==='/'?'÷':c;
      o+=g;
    }else o+=c;
  }
  return o.replace(/\s+$/,'');
}
const fmt=n=>Number(n.toFixed(8)).toLocaleString('en-US',{maximumFractionDigits:8});
function err(){ex='';show(t('err'));$('#res').dataset.err='1'}
function live(){
  const e=ex.replace(/[+\-*\/.]+$/,'');
  if(!/[0-9.][+\-*\/]-?[0-9.]/.test(e))return null;
  try{const r=Function('return '+e)();return isFinite(r)?fmt(r):null}catch(_){return null}
}
function show(r){
  delete $('#res').dataset.err;
  if(r!==undefined){$('#ex').textContent=pretty(ex);$('#res').textContent=r;return}
  const L=live(),endOp=/[+\-*\/.]$/.test(ex);
  $('#ex').textContent=pretty(ex)+(L!==null&&!endOp?'='+minus(L):'');
  $('#res').textContent=(ex.match(/([0-9.]+)[+\-*\/]*$/)||[0,'0'])[1];
}
function key(k){
  const op=/[+\-*\/]$/;
  if(k==='C'){ex='';done=false;return show('0')}
  if(k==='='){
    if(!ex)return;
    try{
      const e=ex.replace(/[+\-*\/.]+$/,'');
      const r=Function('return '+e)();
      if(!isFinite(r)){return err()}
      show(fmt(r));$('#ex').textContent=pretty(e)+'='+minus(fmt(r));ex=String(r);done=true;
    }catch(_){err()}
    return;
  }
  if(/^[0-9]$/.test(k)){
    if(done){ex='';done=false}
    if(/(^|[+\-*\/])0$/.test(ex))ex=ex.slice(0,-1);
    ex+=k;return show();
  }
  if(k==='.'){
    if(done){ex='';done=false}
    const last=(ex.match(/[0-9.]+$/)||[''])[0];
    if(last.includes('.'))return;
    ex+=(last===''?'0.':'.');return show();
  }
  if(k==='%'){ex=ex.replace(/[0-9.]+$/,m=>String(parseFloat(m)/100));return show()}
  if(k==='n'){
    ex=ex.replace(/([+\-*\/]?)([0-9.]+)$/,(m,p,n)=>p===''?'-'+n:p==='+'?'-'+n:p==='-'?'+'+n:p+'-'+n);
    return show();
  }
  done=false;
  if(!ex){if(k==='-')ex='-';return show()}
  if(op.test(ex))ex=ex.slice(0,-1);
  ex+=k;show();
}

function opts(u){const g={};u.forEach((x,i)=>(g[x[3]]=g[x[3]]||[]).push(`<option value="${i}">${un(x)}</option>`));
  return Object.entries(g).map(([k,v])=>`<optgroup label="${G[k][li()]}">${v.join('')}</optgroup>`).join('')}
function fill(){$('#u1').innerHTML=$('#u2').innerHTML=opts(C[cur].u)}
function head(){$('#ct').innerHTML=ICON[C[cur].id]+'<span>'+cn(C[cur])+'</span>'}
function pick(i){
  cur=i;fill();
  $('#u1').value=C[i].d[0];$('#u2').value=C[i].d[1];
  head();conv();
  window.scrollTo(0,0);$('main').scrollTop=0;
}
function nf(r){
  if(r===0)return '0';
  const a=Math.abs(r);
  if(a>=1e9||a<1e-6)return r.toExponential(6).replace(/\.?0+e/,'e');
  return String(+r.toPrecision(10));
}
let swapRot=0;
function swapUnits(){
  const a=$('#u1').value,b=$('#u2').value,v=$('#v2').value;
  $('#u1').value=b;$('#u2').value=a;
  if(v!=='')$('#v1').value=v;
  swapRot^=1;$('#swap').style.transform='rotate('+(swapRot*180)+'deg)';
  conv();
}
function calc(x,a,b){
  const c=C[cur];
  if(c.id==='temp'){
    const k=[v=>v,v=>(v-32)*5/9,v=>v-273.15,v=>(v-491.67)*5/9,v=>v*1.25][a](x);
    return [v=>v,v=>v*9/5+32,v=>v+273.15,v=>(v+273.15)*9/5,v=>v*.8][b](k);
  }
  return x*c.u[a][2]/c.u[b][2];
}
function conv(){
  const x=parseFloat($('#v1').value);
  if(isNaN(x)){$('#v2').value='';return}
  $('#v2').value=nf(calc(x,+$('#u1').value,+$('#u2').value));
}
function convRev(){
  const x=parseFloat($('#v2').value);
  if(isNaN(x)){$('#v1').value='';return}
  $('#v1').value=nf(calc(x,+$('#u2').value,+$('#u1').value));
}

/* ---- Bahasa / Language ---- */
function applyLang(){
  document.documentElement.lang=LANG;$('#swap').setAttribute('aria-label',t('swap'));
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('sel',b.dataset.l===LANG));
  renderCats();
  const a=$('#u1').value,b=$('#u2').value;fill();$('#u1').value=a;$('#u2').value=b;head();
  if($('#res').dataset.err)$('#res').textContent=t('err');
  if($('#modal').style.display==='flex')renderLog();
}
function setLang(l){LANG=l;try{localStorage.setItem('lang',l)}catch(_){}applyLang()}

/* ---- Tab & Info perubahan ---- */
function tab(i){
  document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('on',i===j));
  document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i===j));
}
function renderLog(){
  $('#log').innerHTML=CHANGELOG.map(c=>`<h3>v${c.v} (${t('build')} ${c.b}) <small>${c.tarikh}</small></h3><ul>${(c.nota[LANG]||c.nota.ms).map(n=>`<li>${n}</li>`).join('')}</ul>`).join('');
}
function openLog(){
  renderLog();$('#modal').style.display='flex';
  try{localStorage.setItem('seen',VN+'|'+VC)}catch(_){}
}
pick(0);applyLang();
try{if(localStorage.getItem('seen')!==VN+'|'+VC)openLog()}catch(_){}
</script></body></html>
