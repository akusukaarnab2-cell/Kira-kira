<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:sans-serif;background:#f4f1ff;color:#1e1b4b;height:100vh;display:flex;flex-direction:column}
header{padding:30px 18px 6px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:30px;color:#7c5cff}
small{color:#6b6b8a}
#star{border:0;padding:0;background:none;border-radius:18px;width:64px;height:64px;box-shadow:0 3px 10px #7c5cff44;position:relative}
#star img{width:100%;height:100%;border-radius:18px;display:block}
#dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff6b8b;border:2px solid #f4f1ff}
main{flex:1;overflow:auto;padding:8px 14px}
.page{display:none}.page.on{display:block}
#disp{background:#e9e8ff;border-radius:22px;padding:14px 18px;text-align:right;min-height:104px}
#ex{color:#777;font-size:16px;min-height:20px}
#res{font-size:44px;font-weight:700;word-break:break-all}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pad button{height:62px;border:0;border-radius:18px;font-size:24px;font-weight:700;background:#fffbea;color:#1e1b4b;box-shadow:0 2px 4px #0001}
.pad .f{background:#e6e3ff;color:#7c5cff}.pad .o{background:#ffe1c2;color:#d9480f}
.pad .c{background:#ffd9e0;color:#c92a2a}.pad .eq{background:#b8f0d8;color:#087f5b}
.pad .z{grid-column:span 2}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:0;border-radius:18px;padding:14px 6px;font-size:17px;font-weight:700;color:#1e1b4b}
.cat span{display:block;font-size:30px}.cat small{display:block;font-weight:400}
.box{background:#fff;border-radius:18px;padding:14px;margin-top:12px}
.row{display:flex;gap:8px;margin-top:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:18px;background:#f8f8ff}
select{flex:1.5;min-width:0;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:18px;background:#f8f8ff}
nav{display:flex;background:#fff;padding:8px;gap:8px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border:0;border-radius:18px;padding:10px;background:none;font-size:15px;color:#777}
nav button.on{background:#e6e3ff;color:#7c5cff;font-weight:700}
.ab{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:16px}
nav button:not(.on) svg{filter:grayscale(.75) opacity(.75)}
.cat.sel{background:#e6e3ff!important;outline:3px solid #7c5cff}
#modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:20px}
#modal .box{max-height:80vh;overflow:auto;width:100%;margin:0}

function key(k){
  const op=/[+\-*\/]$/;
  if(k==='C'){ex='';done=false;return show('0')}
  if(k==='='){
    if(!ex)return;
    try{
      const e=ex.replace(/[+\-*\/.]+$/,'');
      const r=Function('return '+e)();
      if(!isFinite(r)){return err()}
      show(fmt(r));$('#ex').textContent=pretty(e)+' =';ex=String(r);done=true;
    }catch(_){err()}
    return;
  }
  if(/^[0-9]$/.test(k)){
    if(done){ex='';done=false}
    if(/(^|[+\-*\/])0$/.test(ex))ex=ex.slice(0,-1);
    ex+=k;return show();
  }
  if(k==='.'){
    if(done){ex='';done=false}
    const last=(ex.match(/[0-9.]+$/)||[''])[0];
    if(last.includes('.'))return;
    ex+=(last===''?'0.':'.');return show();
  }
  if(k==='%'){ex=ex.replace(/[0-9.]+$/,m=>String(parseFloat(m)/100));return show()}
  if(k==='n'){
    ex=ex.replace(/([+\-*\/]?)([0-9.]+)$/,(m,p,n)=>p===''?'-'+n:p==='+'?'-'+n:p==='-'?'+'+n:p+'-'+n);
    return show();
  }
  done=false;
  if(!ex){if(k==='-')ex='-';return show()}
  if(op.test(ex))ex=ex.slice(0,-1);
  ex+=k;show();
}

  if(a>=1e9||a<1e-6)return r.toExponential(6).replace(/\.?0+e/,'e');

}
