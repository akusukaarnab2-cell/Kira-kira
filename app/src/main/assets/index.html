<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:sans-serif;background:#f4f1ff;color:#1e1b4b;height:100vh;display:flex;flex-direction:column}
header{padding:30px 18px 6px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:30px;color:#7c5cff}
small{color:#6b6b8a}
#star{border:0;background:#fff;border-radius:50%;width:48px;height:48px;font-size:22px;box-shadow:0 2px 8px #0002;position:relative}
#dot{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#ff6b8b}
main{flex:1;overflow:auto;padding:8px 14px}
.page{display:none}.page.on{display:block}
#disp{background:#e9e8ff;border-radius:22px;padding:14px 18px;text-align:right;min-height:104px}
#ex{color:#777;font-size:16px;min-height:20px}
#res{font-size:44px;font-weight:700;word-break:break-all}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pad button{height:62px;border:0;border-radius:18px;font-size:24px;font-weight:700;background:#fffbea;color:#1e1b4b;box-shadow:0 2px 4px #0001}
.pad .f{background:#e6e3ff;color:#7c5cff}.pad .o{background:#ffe1c2;color:#d9480f}
.pad .c{background:#ffd9e0;color:#c92a2a}.pad .eq{background:#b8f0d8;color:#087f5b}
.pad .z{grid-column:span 2}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:0;border-radius:18px;padding:14px 6px;font-size:17px;font-weight:700;color:#1e1b4b}
.cat span{display:block;font-size:30px}.cat small{display:block;font-weight:400}
.box{background:#fff;border-radius:18px;padding:14px;margin-top:12px}
.row{display:flex;gap:8px;margin-top:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:18px;background:#f8f8ff}
select{flex:1.5;min-width:0;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:18px;background:#f8f8ff}
nav{display:flex;background:#fff;padding:8px;gap:8px}
nav button{flex:1;border:0;border-radius:18px;padding:10px;background:none;font-size:15px;color:#777}
nav button.on{background:#e6e3ff;color:#7c5cff;font-weight:700}
#modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:20px}
#modal .box{max-height:80vh;overflow:auto;width:100%;margin:0}
</style></head><body>
<header>
  <div><h1>KiraKira ⭐</h1><small>Kira apa sahaja, lebih mudah!</small><br><small id="ver"></small></div>
  <button id="star" onclick="openLog()">✨<i id="dot"></i></button>
</header>
<main>
  <section class="page on">
    <div id="disp"><div id="ex"></div><div id="res">0</div></div>
    <div class="pad" id="pad"></div>
  </section>
  <section class="page">
    <div class="box" style="margin-top:0"><b id="ct">Tinggi</b>
      <div class="row"><input id="v1" type="number" value="100" oninput="conv()"><select id="u1" onchange="conv()"></select></div>
      <div class="row"><input id="v2" readonly><select id="u2" onchange="conv()"></select></div>
    </div>
    <p style="margin:14px 4px 8px"><small>Pilih jenis pertukaran:</small></p>
    <div class="cats" id="cats"></div>
  </section>
</main>
<nav><button class="on" onclick="tab(0)">🧮 Kira</button><button onclick="tab(1)">🔁 Penukar</button></nav>
<div id="modal" onclick="if(event.target===this)this.style.display='none'">
  <div class="box"><h2 style="margin-top:0">Info Perubahan Terkini ✨</h2><div id="log"></div>
  <button class="cat" style="background:#e6e3ff;width:100%" onclick="$('#modal').style.display='none'">Tutup</button></div>
</div>
<script src="changelog.js"></script>
<script>
const $=s=>document.querySelector(s);
const [VN,VC]=(window.App?App.version():'dev|0').split('|');
$('#ver').textContent='v'+VN+' (Build '+VC+')';

/* ---- Kalkulator ---- */
let ex='',done=false;
const K=[['C','C','c'],['+/-','n','f'],['%','%','f'],['÷','/','o'],['7'],['8'],['9'],['×','*','o'],
['4'],['5'],['6'],['−','-','o'],['1'],['2'],['3'],['+','+','o'],['0','0','z'],['.','.',''],['=','=','eq']];
$('#pad').innerHTML=K.map(([l,k,c])=>`<button class="${c||''}" data-k="${k||l}">${l}</button>`).join('');
$('#pad').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)};
const pretty=s=>s.replace(/\*/g,'×').replace(/\//g,'÷');
const fmt=n=>Number(n.toFixed(8)).toLocaleString('en-US',{maximumFractionDigits:8});
function show(r){$('#ex').textContent=pretty(ex);$('#res').textContent=r!==undefined?r:((ex.match(/[0-9.]+$/)||['0'])[0])}
function key(k){
  const op=/[+\-*\/]$/;
  if(k==='C'){ex='';done=false;return show('0')}
  if(k==='='){
    if(!ex)return;
    try{
      const e=ex.replace(/[+\-*\/.]+$/,'');
      const r=Function('return '+e)();
      if(!isFinite(r)){ex='';return show('Ralat')}
      show(fmt(r));$('#ex').textContent=pretty(e)+' =';ex=String(r);done=true;
    }catch(_){ex='';show('Ralat')}
    return;
  }
  if(/^[0-9]$/.test(k)){
    if(done){ex='';done=false}
    if(/(^|[+\-*\/])0$/.test(ex))ex=ex.slice(0,-1);
    ex+=k;return show();
  }
  if(k==='.'){
    if(done){ex='';done=false}
    const last=(ex.match(/[0-9.]+$/)||[''])[0];
    if(last.includes('.'))return;
    ex+=(last===''?'0.':'.');return show();
  }
  if(k==='%'){ex=ex.replace(/[0-9.]+$/,m=>String(parseFloat(m)/100));return show()}
  if(k==='n'){
    ex=ex.replace(/([+\-*\/]?)([0-9.]+)$/,(m,p,n)=>p===''?'-'+n:p==='+'?'-'+n:p==='-'?'+'+n:p+'-'+n);
    return show();
  }
  done=false;
  if(!ex){if(k==='-')ex='-';return show()}
  if(op.test(ex))ex=ex.slice(0,-1);
  ex+=k;show();
}

/* ---- Penukar unit ---- */
/* format unit: [nama, faktor ke unit asas, kumpulan] */
const LEN=[
['Mikrometer (µm)',1e-6,'Metrik'],['Milimeter (mm)',.001,'Metrik'],['Sentimeter (cm)',.01,'Metrik'],['Desimeter (dm)',.1,'Metrik'],['Meter (m)',1,'Metrik'],['Kilometer (km)',1000,'Metrik'],
['Thou / mil',2.54e-5,'Imperial'],['Inci',.0254,'Imperial'],['Kaki (feet)',.3048,'Imperial'],['Ela (yard)',.9144,'Imperial'],['Rantai (chain)',20.1168,'Imperial'],['Furlong',201.168,'Imperial'],['Batu (miles)',1609.344,'Imperial'],
['Jari',.0191,'Tradisional Melayu'],['Kilan',.1778,'Tradisional Melayu'],['Jengkal',.2286,'Tradisional Melayu'],['Hasta',.4572,'Tradisional Melayu'],['Langkah',.762,'Tradisional Melayu'],['Depa',1.8288,'Tradisional Melayu'],
['Fathom (depa laut)',1.8288,'Maritim & Angkasa'],['Kabel (cable)',185.2,'Maritim & Angkasa'],['Batu Nautika (nautical mile)',1852,'Maritim & Angkasa'],['Unit Astronomi (AU)',1.495978707e11,'Maritim & Angkasa'],['Tahun Cahaya (light-year)',9.4607304725808e15,'Maritim & Angkasa'],['Parsec',3.0856775814913673e16,'Maritim & Angkasa']];
const C=[
{n:'Tinggi',e:'📏',bg:'#ffe3ea',s:'cm ↔ m',u:LEN,d:[2,4]},
{n:'Jarak',e:'📍',bg:'#dcecff',s:'m ↔ km',u:LEN,d:[4,5]},
{n:'Berat',e:'⚖️',bg:'#e6e3ff',s:'g ↔ kg',d:[2,3],u:[
 ['Mikrogram (µg)',1e-9,'Metrik'],['Miligram (mg)',1e-6,'Metrik'],['Gram (g)',.001,'Metrik'],['Kilogram (kg)',1,'Metrik'],['Tan metrik',1000,'Metrik'],['Karat',2e-4,'Metrik'],
 ['Gren (grain)',6.479891e-5,'Imperial'],['Auns (oz)',.028349523,'Imperial'],['Paun (lb)',.45359237,'Imperial'],['Stone',6.35029318,'Imperial'],['Tan AS (short ton)',907.18474,'Imperial'],['Tan UK (long ton)',1016.0469088,'Imperial'],
 ['Hun',.000378,'Tradisional Melayu'],['Chi',.00378,'Tradisional Melayu'],['Tahil',.0378,'Tradisional Melayu'],['Kati',.6048,'Tradisional Melayu'],['Pikul',60.48,'Tradisional Melayu'],['Koyan',2419.2,'Tradisional Melayu']]},
{n:'Lebar',e:'↔️',bg:'#fff0d4',s:'cm ↔ m',u:LEN,d:[2,4]},
{n:'Suhu',e:'🌡️',bg:'#ffe5d0',s:'°C ↔ °F',d:[0,1],u:[['Celsius (°C)',1,'Suhu'],['Fahrenheit (°F)',1,'Suhu'],['Kelvin (K)',1,'Suhu'],['Rankine (°R)',1,'Suhu'],['Réaumur (°Ré)',1,'Suhu']]},
{n:'Masa',e:'⏰',bg:'#d8f5e6',s:'s ↔ min',d:[1,2],u:[
 ['Mikrosaat (µs)',1e-6,'Singkat'],['Milisaat (ms)',.001,'Singkat'],['Saat (s)',1,'Singkat'],['Minit (min)',60,'Singkat'],
 ['Jam',3600,'Harian'],['Hari',86400,'Harian'],['Minggu',604800,'Harian'],['Dua minggu',1209600,'Harian'],
 ['Bulan (purata)',2629800,'Panjang'],['Tahun',31557600,'Panjang'],['Dekad',315576000,'Panjang'],['Abad',3155760000,'Panjang']]},
{n:'Isipadu',e:'🧊',bg:'#ffe3ea',s:'ml ↔ L',d:[1,3],u:[
 ['Mikroliter (µl)',1e-6,'Metrik'],['Sentimeter padu (cm³)',.001,'Metrik'],['Mililiter (ml)',.001,'Metrik'],['Sentiliter (cl)',.01,'Metrik'],['Liter (L)',1,'Metrik'],['Hektoliter (hl)',100,'Metrik'],['Meter padu (m³)',1000,'Metrik'],
 ['Sudu teh AS (tsp)',.00492892,'Imperial'],['Sudu besar AS (tbsp)',.0147868,'Imperial'],['Auns cecair AS',.0295735,'Imperial'],['Cawan AS',.236588,'Imperial'],['Pint AS',.473176,'Imperial'],['Kuart AS',.946353,'Imperial'],['Gelen AS',3.785412,'Imperial'],['Pint UK',.568261,'Imperial'],['Gelen UK',4.54609,'Imperial'],['Inci padu',.016387064,'Imperial'],['Kaki padu',28.316847,'Imperial'],
 ['Cupak',1.1365,'Tradisional Melayu'],['Gantang',4.54609,'Tradisional Melayu']]},
{n:'Luas',e:'🔲',bg:'#e6e3ff',s:'m² ↔ km²',d:[2,4],u:[
 ['Sentimeter persegi (cm²)',1e-4,'Metrik'],['Meter persegi (m²)',1,'Metrik'],['Are (a)',100,'Metrik'],['Hektar (ha)',1e4,'Metrik'],['Kilometer persegi (km²)',1e6,'Metrik'],
 ['Inci persegi',6.4516e-4,'Imperial'],['Kaki persegi',.09290304,'Imperial'],['Ela persegi',.83612736,'Imperial'],['Ekar (acre)',4046.8564224,'Imperial'],['Batu persegi',2589988.110336,'Imperial'],
 ['Relong',2871,'Tradisional Melayu']]},
{n:'Kelajuan',e:'💨',bg:'#d8f5e6',s:'m/s ↔ km/j',d:[0,1],u:[
 ['Meter/saat (m/s)',1,'Metrik'],['Kilometer/jam (km/j)',1/3.6,'Metrik'],['Kaki/saat (ft/s)',.3048,'Imperial'],['Batu/jam (mph)',.44704,'Imperial'],
 ['Knot',.514444444,'Maritim & Angkasa'],['Mach',340.29,'Maritim & Angkasa'],['Kelajuan cahaya (c)',299792458,'Maritim & Angkasa']]},
{n:'Data',e:'💾',bg:'#dcecff',s:'MB ↔ GB',d:[3,4],u:[
 ['Bit',.125,'Asas 10'],['Bait (B)',1,'Asas 10'],['Kilobait (KB)',1e3,'Asas 10'],['Megabait (MB)',1e6,'Asas 10'],['Gigabait (GB)',1e9,'Asas 10'],['Terabait (TB)',1e12,'Asas 10'],['Petabait (PB)',1e15,'Asas 10'],
 ['Kibibait (KiB)',1024,'Asas 2'],['Mebibait (MiB)',1048576,'Asas 2'],['Gibibait (GiB)',1073741824,'Asas 2'],['Tebibait (TiB)',1099511627776,'Asas 2']]},
{n:'Tekanan',e:'🎈',bg:'#ffe5d0',s:'kPa ↔ bar',d:[1,3],u:[
 ['Pascal (Pa)',1,'Metrik'],['Kilopascal (kPa)',1000,'Metrik'],['Milibar (mbar)',100,'Metrik'],['Bar',1e5,'Metrik'],['Megapascal (MPa)',1e6,'Metrik'],
 ['Atmosfera (atm)',101325,'Lain-lain'],['mmHg / torr',133.322368,'Lain-lain'],['psi',6894.757293,'Imperial']]},
{n:'Tenaga',e:'⚡',bg:'#fff0d4',s:'J ↔ kJ',d:[0,1],u:[
 ['Joule (J)',1,'Metrik'],['Kilojoule (kJ)',1000,'Metrik'],['Megajoule (MJ)',1e6,'Metrik'],['Watt-jam (Wh)',3600,'Metrik'],['Kilowatt-jam (kWh)',3.6e6,'Metrik'],
 ['Kalori (cal)',4.184,'Makanan & Haba'],['Kilokalori (kkal)',4184,'Makanan & Haba'],['BTU',1055.05585,'Makanan & Haba'],
 ['Kaki-paun (ft·lb)',1.3558179,'Imperial'],['Elektron-volt (eV)',1.602176634e-19,'Fizik']]},
{n:'Kuasa',e:'🔌',bg:'#ffe3ea',s:'W ↔ kW',d:[0,1],u:[
 ['Watt (W)',1,'Metrik'],['Kilowatt (kW)',1000,'Metrik'],['Megawatt (MW)',1e6,'Metrik'],
 ['Kuasa kuda (hp)',745.69987,'Imperial'],['Kuasa kuda metrik (PS)',735.49875,'Imperial'],['BTU/jam',.29307107,'Imperial']]},
{n:'Sudut',e:'📐',bg:'#e6e3ff',s:'° ↔ rad',d:[0,1],u:[
 ['Darjah (°)',1,'Sudut'],['Minit lengkok (′)',1/60,'Sudut'],['Saat lengkok (″)',1/3600,'Sudut'],['Radian (rad)',57.29577951308232,'Sudut'],['Gradian (grad)',.9,'Sudut'],['Putaran penuh',360,'Sudut']]}];
let cur=0;
$('#cats').innerHTML=C.map((c,i)=>`<button class="cat" style="background:${c.bg}" onclick="pick(${i})"><span>${c.e}</span>${c.n}<small>${c.s}</small></button>`).join('');
function opts(u){const g={};u.forEach((x,i)=>(g[x[2]]=g[x[2]]||[]).push(`<option value="${i}">${x[0]}</option>`));
  return Object.entries(g).map(([k,v])=>`<optgroup label="${k}">${v.join('')}</optgroup>`).join('')}
function pick(i){
  cur=i;const c=C[i];
  $('#ct').textContent=c.e+' '+c.n;
  $('#u1').innerHTML=$('#u2').innerHTML=opts(c.u);
  $('#u1').value=c.d[0];$('#u2').value=c.d[1];
  conv();
  window.scrollTo(0,0);$('main').scrollTop=0;
}
function nf(r){
  if(r===0)return '0';
  const a=Math.abs(r);
  if(a>=1e9||a<1e-6)return r.toExponential(6).replace(/\.?0+e/,'e');
  return String(+r.toPrecision(10));
}
function conv(){
  const c=C[cur],a=+$('#u1').value,b=+$('#u2').value,x=parseFloat($('#v1').value);
  if(isNaN(x)){$('#v2').value='';return}
  let r;
  if(c.n==='Suhu'){
    const t=[v=>v,v=>(v-32)*5/9,v=>v-273.15,v=>(v-491.67)*5/9,v=>v*1.25][a](x);
    r=[v=>v,v=>v*9/5+32,v=>v+273.15,v=>(v+273.15)*9/5,v=>v*.8][b](t);
  }else r=x*c.u[a][1]/c.u[b][1];
  $('#v2').value=nf(r);
}
pick(0);

/* ---- Tab & Info perubahan ---- */
function tab(i){
  document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('on',i===j));
  document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i===j));
}
function openLog(){
  $('#log').innerHTML=CHANGELOG.map(c=>`<h3>v${c.v} (Build ${c.b}) <small>${c.tarikh}</small></h3><ul>${c.nota.map(n=>`<li>${n}</li>`).join('')}</ul>`).join('');
  $('#modal').style.display='flex';$('#dot').style.display='none';
  try{localStorage.setItem('seen',VN+'|'+VC)}catch(_){}
}
try{if(localStorage.getItem('seen')!==VN+'|'+VC)openLog()}catch(_){}
</script></body></html>
